name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, xml, ctype, json, tokenizer, fileinfo, bcmath, intl, gd, curl, zip, sqlite3, pdo_sqlite
          tools: composer:v2

      - name: Install PHP deps
        run: composer install --no-interaction --prefer-dist

      - name: Copy .env
        run: |
          cp .env.example .env
          sed -i 's|DB_CONNECTION=mysql|DB_CONNECTION=sqlite|' .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=:memory:|' .env
          php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Build
        run: npm run build
