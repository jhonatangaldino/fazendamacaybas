name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_BASE: /home/u931382046/domains/fazendamacaybas.com.br
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, xml, ctype, json, tokenizer, fileinfo, bcmath, intl, gd, curl, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --optimize-autoloader

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare release tarball
        run: |
          set -e
          RELEASE_ID=$(date -u +'%Y%m%d%H%M%S')
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV
          mkdir -p artifact
          # Copia só o necessário para produção (exclui dev files, tests, logs).
          tar --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./node_modules' \
              --exclude='./tests' \
              --exclude='./storage/logs/*' \
              --exclude='./storage/framework/cache/data/*' \
              --exclude='./storage/framework/sessions/*' \
              --exclude='./storage/framework/views/*' \
              --exclude='./.env*' \
              --exclude='./CREDENCIAIS*' \
              --exclude='./docs' \
              -czf artifact/release-${RELEASE_ID}.tar.gz .

      # Escrita defensiva da chave SSH.
      #
      # Por que NÃO usar `echo "${{ secrets.SSH_PRIVATE_KEY }}"`:
      #   - aspas duplas fazem o shell interpretar $, \ e ` dentro da chave
      #   - `echo` em algumas distros interpreta escapes (-e implícito)
      #   - interpolação inline do ${{ }} pode introduzir CRLF se a secret
      #     foi colada de um editor Windows
      # Este bloco usa env var + printf, valida o conteúdo antes de seguir e
      # testa a conexão. Qualquer falha aqui (secret vazia, chave inválida,
      # host offline, usuário errado) falha com mensagem clara — em vez de
      # deixar o rsync/ssh quebrar depois sem contexto.
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Sem `set -e`: usamos error handling manual para garantir que
          # CADA mensagem de diagnóstico aparece no log antes de qualquer exit.
          # Resultado: se algo falhar, o log + GITHUB_STEP_SUMMARY mostra
          # exatamente o quê, em vez do genérico "Process completed with exit code 1".

          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo "## Diagnóstico Setup SSH key" >> "$SUMMARY"

          log_err() {
            echo "::error::$1"
            echo "- ❌ $1" >> "$SUMMARY"
          }
          log_ok() {
            echo "✅ $1"
            echo "- ✅ $1" >> "$SUMMARY"
          }

          # ── 1. Presença de cada secret (tamanho, não o valor) ─────────
          # GitHub mascara secrets em stdout, mas ${#VAR} (comprimento)
          # não é mascarado — serve para detectar secret vazia.
          echo "### Checagem de secrets" >> "$SUMMARY"
          FAIL=0
          for var in SSH_PRIVATE_KEY SSH_HOST SSH_PORT SSH_USER; do
            val="$(printenv "$var" || true)"
            len="${#val}"
            if [ "$len" -eq 0 ]; then
              log_err "Secret $var está VAZIA ou AUSENTE (len=0). Configure em Settings → Secrets and variables → Actions."
              FAIL=1
            else
              log_ok "$var presente (len=$len)"
            fi
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Abortando: secret(s) ausente(s). Veja resumo do job."
            exit 1
          fi

          # ── 2. Prepara diretório ──────────────────────────────────────
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # ── 3. Grava chave via printf + env var (preserva bytes) ─────
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          KEY_BYTES=$(wc -c < ~/.ssh/id_deploy)
          KEY_LINES=$(wc -l < ~/.ssh/id_deploy)
          echo "Chave escrita: $KEY_BYTES bytes, $KEY_LINES linhas" >> "$SUMMARY"

          # ── 4. Normaliza CRLF se a secret veio do Windows ────────────
          if grep -q $'\r' ~/.ssh/id_deploy; then
            echo "::warning::SSH_PRIVATE_KEY contém CRLF — convertendo para LF"
            echo "- ⚠️ CRLF detectado e convertido" >> "$SUMMARY"
            sed -i 's/\r$//' ~/.ssh/id_deploy
          fi

          chmod 600 ~/.ssh/id_deploy

          # ── 5. Cabeçalho/rodapé da chave (conteúdo mascarado pelo GH) ─
          FIRST_LINE="$(head -n 1 ~/.ssh/id_deploy)"
          LAST_LINE="$(tail -n 1 ~/.ssh/id_deploy)"
          echo "### Cabeçalho/rodapé da chave" >> "$SUMMARY"
          echo "- Primeira linha: \`$FIRST_LINE\`" >> "$SUMMARY"
          echo "- Última linha: \`$LAST_LINE\`" >> "$SUMMARY"

          case "$FIRST_LINE" in
            "-----BEGIN OPENSSH PRIVATE KEY-----"|"-----BEGIN RSA PRIVATE KEY-----"|"-----BEGIN EC PRIVATE KEY-----"|"-----BEGIN PRIVATE KEY-----"|"-----BEGIN DSA PRIVATE KEY-----")
              log_ok "Cabeçalho da chave reconhecido"
              ;;
            *)
              log_err "Primeira linha não é cabeçalho PEM esperado. Primeira linha literal: [$FIRST_LINE]"
              log_err "Cabeçalhos aceitos: BEGIN OPENSSH/RSA/EC/DSA/PRIVATE KEY."
              exit 1
              ;;
          esac

          # ── 6. Valida parse com ssh-keygen ────────────────────────────
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /tmp/pub.out 2> /tmp/keygen.err; then
            log_err "ssh-keygen falhou ao parsear a chave privada."
            echo "### Stderr do ssh-keygen" >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
            cat /tmp/keygen.err >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
            cat /tmp/keygen.err
            echo ""
            echo "Dica: regere o secret copiando o arquivo inteiro da chave privada"
            echo "(incluindo BEGIN/END) sem editar — preferir ed25519 ou RSA sem passphrase."
            exit 1
          fi
          log_ok "Chave SSH parseável: $(ssh-keygen -l -f ~/.ssh/id_deploy)"

          # ── 7. Host reachable + keyscan ───────────────────────────────
          echo "### Conectividade" >> "$SUMMARY"
          if ! nc -z -w 10 "$SSH_HOST" "$SSH_PORT" 2>/dev/null; then
            log_err "TCP ${SSH_HOST}:${SSH_PORT} não respondeu em 10s. Host pode estar offline, porta errada, ou IP mudou."
            exit 1
          fi
          log_ok "TCP ${SSH_HOST}:${SSH_PORT} OK"

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err
          KEYSCAN_LINES=$(wc -l < ~/.ssh/known_hosts)
          if [ "$KEYSCAN_LINES" -eq 0 ]; then
            log_err "ssh-keyscan não retornou chave do host."
            cat /tmp/keyscan.err >> "$SUMMARY"
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts
          log_ok "ssh-keyscan adicionou $KEYSCAN_LINES entries a known_hosts"

          # ── 8. Teste de autenticação ───────────────────────────────────
          echo "### Teste de conexão SSH" >> "$SUMMARY"
          if ssh -v -i ~/.ssh/id_deploy -p "$SSH_PORT" \
                 -o BatchMode=yes \
                 -o ConnectTimeout=15 \
                 "$SSH_USER@$SSH_HOST" 'echo "REMOTE_OK"; id; pwd; php -v 2>&1 | head -1' > /tmp/ssh.out 2> /tmp/ssh.err; then
            log_ok "SSH autenticou em ${SSH_USER}@${SSH_HOST}"
            echo '```' >> "$SUMMARY"
            cat /tmp/ssh.out >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
            cat /tmp/ssh.out
          else
            log_err "SSH falhou ao autenticar em ${SSH_USER}@${SSH_HOST}"
            log_err "Chave privada é VÁLIDA (passou no parse), mas a pública correspondente provavelmente não está em ~/.ssh/authorized_keys do servidor."
            echo "### Stderr do ssh (verbose)" >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
            tail -n 40 /tmp/ssh.err >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
            echo "--- stderr (ultimas 40 linhas do ssh -v) ---"
            tail -n 40 /tmp/ssh.err

            # Imprime a chave pública derivada da privada — NÃO é secret,
            # o GitHub não mascara. Usuário cola isso em authorized_keys do
            # servidor (Hostinger → SSH Access → SSH Keys → Add new) e o
            # próximo deploy autentica.
            echo "### ⇨ Ação necessária: instalar esta chave pública no servidor" >> "$SUMMARY"
            echo '' >> "$SUMMARY"
            echo 'No Hostinger (hPanel → Advanced → SSH Access → SSH Keys → Add new key), cole:' >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
            ssh-keygen -y -f ~/.ssh/id_deploy >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
            echo '' >> "$SUMMARY"
            echo "Fingerprint correspondente: $(ssh-keygen -l -f ~/.ssh/id_deploy)" >> "$SUMMARY"

            echo ""
            echo "=============================================================="
            echo "  ACAO NECESSARIA — instale esta chave publica no Hostinger:"
            echo "=============================================================="
            ssh-keygen -y -f ~/.ssh/id_deploy
            echo "=============================================================="
            echo "  Fingerprint: $(ssh-keygen -l -f ~/.ssh/id_deploy)"
            echo "=============================================================="
            exit 1
          fi

      - name: Upload release via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          rsync -avz --progress \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT -o StrictHostKeyChecking=no" \
            artifact/release-${RELEASE_ID}.tar.gz \
            "$SSH_USER@$SSH_HOST:${DEPLOY_BASE}/artifacts/"

      - name: Activate release on server (atomic switch)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=no \
              "$SSH_USER@$SSH_HOST" \
              "RELEASE_ID=${RELEASE_ID} DEPLOY_BASE=${DEPLOY_BASE} bash ${DEPLOY_BASE}/shared/scripts/activate.sh"

      - name: Health check
        run: |
          sleep 3
          curl -fsS https://fazendamacaybas.com.br/up || (echo "Health check falhou"; exit 1)
          curl -fsS https://fazendamacaybas.com.br/health | head -c 500

      - name: Notify success
        if: success()
        run: echo "✅ Deploy ${RELEASE_ID} concluído com sucesso."

      - name: Notify failure
        if: failure()
        run: echo "❌ Deploy falhou. Verifique os logs e o symlink atual."
