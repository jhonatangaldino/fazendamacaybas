name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_BASE: /home/u931382046/domains/fazendamacaybas.com.br
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, xml, ctype, json, tokenizer, fileinfo, bcmath, intl, gd, curl, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --optimize-autoloader

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare release tarball
        run: |
          set -e
          RELEASE_ID=$(date -u +'%Y%m%d%H%M%S')
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV
          mkdir -p artifact
          # Copia só o necessário para produção (exclui dev files, tests, logs).
          tar --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./node_modules' \
              --exclude='./tests' \
              --exclude='./storage/logs/*' \
              --exclude='./storage/framework/cache/data/*' \
              --exclude='./storage/framework/sessions/*' \
              --exclude='./storage/framework/views/*' \
              --exclude='./.env*' \
              --exclude='./CREDENCIAIS*' \
              --exclude='./docs' \
              -czf artifact/release-${RELEASE_ID}.tar.gz .

      # Escrita defensiva da chave SSH.
      #
      # Por que NÃO usar `echo "${{ secrets.SSH_PRIVATE_KEY }}"`:
      #   - aspas duplas fazem o shell interpretar $, \ e ` dentro da chave
      #   - `echo` em algumas distros interpreta escapes (-e implícito)
      #   - interpolação inline do ${{ }} pode introduzir CRLF se a secret
      #     foi colada de um editor Windows
      # Este bloco usa env var + printf, valida o conteúdo antes de seguir e
      # testa a conexão. Qualquer falha aqui (secret vazia, chave inválida,
      # host offline, usuário errado) falha com mensagem clara — em vez de
      # deixar o rsync/ssh quebrar depois sem contexto.
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail

          # ── 1. Sanity check dos secrets ───────────────────────────────
          for var in SSH_PRIVATE_KEY SSH_HOST SSH_PORT SSH_USER; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Secret $var está vazia ou ausente. Configure em Settings → Secrets and variables → Actions."
              exit 1
            fi
          done
          echo "✅ Secrets presentes (host=$SSH_HOST port=$SSH_PORT user=$SSH_USER)"

          # ── 2. Prepara diretório com permissão correta ────────────────
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # ── 3. Grava chave usando printf via env var ──────────────────
          # printf '%s\n' "$VAR" preserva o conteúdo literal da env var
          # sem interpretar backslash, $ ou crases. Só então chmod 600.
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy

          # ── 4. Normaliza CRLF se a secret foi colada do Windows ───────
          if grep -q $'\r' ~/.ssh/id_deploy; then
            echo "::warning::SSH_PRIVATE_KEY contém CRLF — convertendo para LF"
            sed -i 's/\r$//' ~/.ssh/id_deploy
          fi

          chmod 600 ~/.ssh/id_deploy

          # ── 5. Valida que é uma chave SSH parseável ───────────────────
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY não é uma chave SSH válida."
            echo "Total de linhas: $(wc -l < ~/.ssh/id_deploy)"
            echo "Primeira linha (deve ser -----BEGIN ... PRIVATE KEY-----):"
            head -n 1 ~/.ssh/id_deploy
            echo "Última linha (deve ser -----END ... PRIVATE KEY-----):"
            tail -n 1 ~/.ssh/id_deploy
            echo ""
            echo "Dica: regere a secret copiando o arquivo inteiro de chave privada"
            echo "(inclusive as linhas BEGIN/END) e cole no GitHub sem editar."
            exit 1
          fi
          echo "✅ Chave SSH válida: $(ssh-keygen -l -f ~/.ssh/id_deploy)"

          # ── 6. Coleta host key (SEM 2>/dev/null — queremos ver erros) ─
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "✅ Host $SSH_HOST:$SSH_PORT adicionado a known_hosts"

          # ── 7. Teste de conexão — falha aqui antes do rsync ───────────
          echo "▶ Testando conexão SSH..."
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST" 'echo "✅ SSH conectou"; id; pwd; php -v 2>&1 | head -1'

      - name: Upload release via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          rsync -avz --progress \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT -o StrictHostKeyChecking=no" \
            artifact/release-${RELEASE_ID}.tar.gz \
            "$SSH_USER@$SSH_HOST:${DEPLOY_BASE}/artifacts/"

      - name: Activate release on server (atomic switch)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=no \
              "$SSH_USER@$SSH_HOST" \
              "RELEASE_ID=${RELEASE_ID} DEPLOY_BASE=${DEPLOY_BASE} bash ${DEPLOY_BASE}/shared/scripts/activate.sh"

      - name: Health check
        run: |
          sleep 3
          curl -fsS https://fazendamacaybas.com.br/up || (echo "Health check falhou"; exit 1)
          curl -fsS https://fazendamacaybas.com.br/health | head -c 500

      - name: Notify success
        if: success()
        run: echo "✅ Deploy ${RELEASE_ID} concluído com sucesso."

      - name: Notify failure
        if: failure()
        run: echo "❌ Deploy falhou. Verifique os logs e o symlink atual."
